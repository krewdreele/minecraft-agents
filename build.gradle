plugins {
    id 'fabric-loom' version "${loom_version}"
}

group = 'org.minecraftagents'
version = mod_version

def localAppData = System.getenv('LOCALAPPDATA')
def checkout = layout.projectDirectory.asFile.toPath().normalize()
def onOneDrive = ['OneDrive', 'OneDriveConsumer', 'OneDriveCommercial'].any { name ->
    def syncRoot = System.getenv(name)
    syncRoot && checkout.startsWith(new File(syncRoot).toPath().normalize())
}
if (localAppData && onOneDrive) {
    // Gradle needs to be able to replace generated class directories on each rebuild.
    def checkoutId = UUID.nameUUIDFromBytes(projectDir.canonicalPath.getBytes('UTF-8'))
    layout.buildDirectory = new File(localAppData, "MinecraftAgents/builds/${checkoutId}")
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation fabricApi.module('fabric-command-api-v2', fabric_api_version)
    modImplementation fabricApi.module('fabric-lifecycle-events-v1', fabric_api_version)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

loom {
    runs {
        configureEach {
            property 'minecraftagents.projectDir', projectDir.absolutePath
        }
        client {
            runDir = 'run/client'
        }
        console {
            environment 'server'
            mainClass.set('org.minecraftagents.console.ConsoleBootstrap')
            runDir = 'run/console'
            property 'java.awt.headless', 'true'
            programArgs file('run/client/saves').absolutePath,
                    providers.gradleProperty('consoleWorld').getOrElse('Console World')
        }
    }
}

tasks.named('runConsole', JavaExec) {
    standardInput = System.in
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    from 'LICENSE'
}
